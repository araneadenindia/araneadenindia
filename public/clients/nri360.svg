<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-nri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181D"/>
      <stop offset="100%" stop-color="#0E0E11"/>
    </linearGradient>
    <linearGradient id="blue-nri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#3A7BD5"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg-nri)" stroke="#26262D" stroke-width="2"/>
  <!-- Global 360 Meridian & Concierge Crest -->
  <g transform="translate(64, 48)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#blue-nri)" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="9" ry="20" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="url(#blue-nri)" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="3.5" fill="#DF2531"/>
  </g>
  <text x="64" y="94" font-family="'Exo', 'Inter', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">NRI</text>
  <text x="64" y="106" font-family="'Exo', 'Inter', sans-serif" font-size="8.5" font-weight="800" fill="url(#blue-nri)" text-anchor="middle" letter-spacing="2">360°</text>
</svg>
